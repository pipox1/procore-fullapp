<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUTEC Procore Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;align-items:center;justify-content:center}
        .container{text-align:center;padding:60px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:400px}
        .logo{width:80px;height:80px;background:linear-gradient(135deg,#F47E42,#E56A2E);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
        .logo i{font-size:36px;color:#fff}
        h1{font-size:28px;margin-bottom:12px;color:#2d3748}
        p{color:#718096;margin-bottom:32px}
        .btn{display:inline-flex;align-items:center;gap:12px;padding:16px 32px;background:linear-gradient(135deg,#F47E42,#E56A2E);color:#fff;text-decoration:none;border-radius:12px;font-size:16px;font-weight:600;transition:all 0.3s}
        .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(244,126,66,0.4)}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><i class="fas fa-tools"></i></div>
        <h1>FLUTEC Quick Tools</h1>
        <p>Accede a todas las herramientas de Procore</p>
        <a href="/api/auth/login" class="btn">
            <i class="fas fa-sign-in-alt"></i> Conectar con Procore
        </a>
    </div>
</body>
</html>
